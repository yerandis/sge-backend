# ═══════════════════════════════════════════
# CONFIGURACIÓN DEL SERVIDOR
# ═══════════════════════════════════════════
server.port=8080

# ═══════════════════════════════════════════
# CONFIGURACIÓN DE BASE DE DATOS
# ═══════════════════════════════════════════
spring.datasource.url=jdbc:postgresql://localhost:5416/sge_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ═══════════════════════════════════════════
# CONFIGURACIÓN DE JPA / HIBERNATE
# ═══════════════════════════════════════════

# validate: verifica que las entidades coincidan con las tablas (usa en producción)
# update: actualiza el esquema automáticamente (usa solo en desarrollo)
# create: borra y recrea las tablas al arrancar (¡cuidado! se pierden datos)
# create-drop: igual que create pero borra al cerrar la aplicación
# none: no hace nada (usa en producción con Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update

# Muestra el SQL generado por Hibernate en la consola
# Útil para depurar, desactivar en producción
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de PostgreSQL para Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ═══════════════════════════════════════════
# CONFIGURACIÓN DE LOGGING
# ═══════════════════════════════════════════
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.empresa.sge=DEBUG

# ═══════════════════════════════════════════
# NOMBRE DE LA APLICACIÓN
# ═══════════════════════════════════════════
spring.application.name=sge-backend